services:
  - type: web
    name: subscription-reminder-backend
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && cd apps/backend && pnpm prisma generate && pnpm build
    startCommand: cd apps/backend && pnpm prisma migrate deploy && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subscription-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 5000

databases:
  - name: subscription-db
    plan: free
    databaseName: subscriptions
    user: subscriptions_user
